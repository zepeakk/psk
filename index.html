      { id: 1, src: './psk1.png', alt: 'psk1', link: 'https://zepeakk.github.io/bluepeak/' },
      { id: 2, src: './psk2.png', alt: 'psk2', link: 'https://zepeakk.github.io/midnightpeak/' },
      { id: 3, src: './psk3.png', alt: 'psk3', link: 'https://zepeakk.github.io/letmepeak/' }
    ];

    function CastModal({ schedule, onClose }) {
      if (!schedule) return null;

      let castList = [];
      if (schedule.playTitle === '청새치') {
        castList = [
          { role: '그레고리오/에벌린', name: schedule.gregorio, highlight: true },
          { role: '밀러/루소', name: schedule.miller },
        ];
      } else if (schedule.playTitle === '렛미플라이') {
        castList = [
          { role: '정분', name: schedule.jeongbun, highlight: true },
          { role: '노인남원', name: schedule.oldNamwon },
          { role: '선희', name: schedule.sunhee },
          { role: '청년남원', name: schedule.youngNamwon }
        ];
      } else {
        castList = [
          { role: 'VISITOR', name: schedule.visitor, highlight: true },
          { role: 'MAN', name: schedule.man },
          { role: 'WOMAN', name: schedule.woman },
          { role: 'PLAYER 1', name: schedule.p1 },
          { role: 'PLAYER 2', name: schedule.p2 },
          { role: 'PLAYER 3', name: schedule.p3 },
          { role: 'PLAYER 4', name: schedule.p4 },
          { role: 'PIANIST', name: schedule.pianist },
        ];
      }

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs" onClick={onClose}>
          <div className="relative bg-[#FAFCFA] border-2 border-[#2D5A38] rounded-xl w-full max-w-[320px] p-4 shadow-lg space-y-3" onClick={(e) => e.stopPropagation()}>
            <div className="text-center pb-2 border-b border-[#D2E0D4]">
              <div className="inline-block bg-[#2D5A38] text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full mb-1">
                {schedule.event || '기본 회차'} {schedule.ep ? `(${schedule.ep})` : ''} {schedule.song ? `- ${schedule.song}` : ''}
              </div>
              <h3 className="text-xs font-black text-[#1B3622]">
                [{schedule.playTitle}] {schedule.date} ({schedule.day}) {schedule.time}
              </h3>
            </div>

            <div className={`grid gap-1.5 ${schedule.playTitle === '청새치' ? 'grid-cols-1' : 'grid-cols-2'}`}>
              {castList.map((item, idx) => (
                <div 
                  key={idx} 
                  className={`p-1.5 rounded border text-center flex flex-col justify-center ${
                    item.highlight 
                      ? 'bg-[#2D5A38] text-white border-[#2D5A38] font-bold' 
                      : 'bg-white text-[#223328] border-[#D2E0D4]'
                  }`}
                >
                  <span className={`text-[8px] font-semibold tracking-tight ${item.highlight ? 'text-[#C2E0C8]' : 'text-[#527D5C]'}`}>
                    {item.role}
                  </span>
                  <span className="text-[11px] font-bold">{item.name}</span>
                </div>
              ))}

              onClick={onClose} 
              className="w-full py-1.5 bg-[#2D5A38] text-white font-bold text-xs rounded-md hover:bg-[#23472C] transition active:scale-95"
            >
              닫기
            </button>
          </div>
        </div>
      );

    function App() {
      const [selectedSchedule, setSelectedSchedule] = useState(null);

      const getTextColorClass = (title) => {
        if (title === '청새치') return 'text-[#0284c7]';
        if (title === '렛미플라이') return 'text-[#d9536f]';
        return 'text-[#1e3a8a]';
      };

      const getBtnStyle = (title, hasEvent) => {
        if (title === '청새치') {
          return hasEvent ? 'bg-[#0284c7] text-white' : 'bg-[#e0f2fe] text-[#0369a1]';
        }
        if (title === '렛미플라이') {
          return hasEvent ? 'bg-[#d9536f] text-white' : 'bg-[#fce7f3] text-[#be185d]';
        }
        return hasEvent ? 'bg-[#1e3a8a] text-white' : 'bg-[#e0e7ff] text-[#1d4ed8]';
      };

      return (
        <div className="max-w-[393px] mx-auto min-h-screen flex flex-col justify-between p-3 box-border space-y-3">
          <div>
            {/* 타이틀 영역 */}
            <header className="text-center py-2 mb-2 border-b border-[#C8DACB]">
              <h1 className="text-base font-black text-[#1B3622] tracking-wider">PSK</h1>
            </header>

            {/* 스케줄 테이블 영역 */}
            <main className="table-container shadow-sm mb-3">
              <table className="schedule-tbl">
                <thead>
                  <tr>
                    <th style={{ width: '32%' }}>극</th>
                    <th style={{ width: '24%' }}>일자</th>
                    <th style={{ width: '18%' }}>시간</th>
                    <th style={{ width: '26%' }}>출연진 / 이벤트</th>
                  </tr>
                </thead>
                
                <tbody>
                  {SCHEDULES.map((item) => {
                    const colorClass = getTextColorClass(item.playTitle);
                    return (
                      <tr key={item.id}>
                        <td className={`font-bold px-1 ${colorClass}`}>
                          {item.playTitle}
                        </td>
                        <td className={`font-semibold ${colorClass}`}>
                          {item.date.slice(5)} ({item.day})
                        </td>
                        <td className={`font-black ${colorClass}`}>
                          {item.time}
                        </td>
                        <td>
                          <button
                            onClick={() => setSelectedSchedule(item)}
                            className={`text-[9px] font-bold px-1.5 py-0.5 rounded transition active:scale-95 ${getBtnStyle(item.playTitle, !!item.event)}`}
                          >
                            {item.event || '출연진'}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </main>

            {/* 프로필 이미지 + 정산판 이동 버튼 영역 */}
            <section className="grid grid-cols-3 gap-2 p-2 bg-white/80 rounded-xl border border-[#D2E0D4] shadow-xs backdrop-blur-xs">
              {PROFILE_IMAGES.map((img) => (
                <div key={img.id} className="flex flex-col space-y-1.5">
                  <div className="relative aspect-square w-full rounded-lg overflow-hidden border border-[#D2E0D4] bg-[#F4F8F5] flex items-center justify-center">
                    <img 
                      src={img.src} 
                      alt={img.alt} 
                      className="w-full h-full object-cover object-top transition-transform duration-200 hover:scale-105"
                      onError={(e) => {
                        e.target.style.display = 'none';
                        e.target.nextElementSibling.style.display = 'flex';
                      }}
                    />
                    <div className="hidden absolute inset-0 flex-col items-center justify-center text-[10px] text-[#527D5C] font-bold bg-[#EBF1EC]">
                      <span>{img.alt}</span>
                      <span className="text-[8px] font-normal text-[#88998C]">.png</span>
                    </div>
                  </div>

                  {/* 정산판 버튼 (배경색 없음, 라인만 투명하게 매칭) */}
                  <a
                    href={img.link}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="block text-center w-full py-1 bg-transparent border border-[#D2E0D4] text-[#2D5A38] text-[10px] font-semibold rounded-md hover:bg-white/50 transition active:scale-95"
                  >
                    정산판
                  </a>
                </div>
              ))}
            </section>
          </div>

          {/* 이벤트 클릭 모달 */}
          {selectedSchedule && (
            <CastModal schedule={selectedSchedule} onClose={() => setSelectedSchedule(null)} />
          )}

          {/* 하단 문의 문구 */}
          <footer className="text-center py-2">
            <p className="text-[8px] text-[#527D5C] font-semibold">
              문의 @hillpeakk 로 주세요.
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
