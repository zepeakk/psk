      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.88);

      font-size: 10.5px;

    /* --- 일자별 상세 스케줄 선택 모달 --- */
    function DailyModal({ dateStr, schedules, onClose, onSelectSchedule }) {
      if (!dateStr) return null;

      const dateObj = new Date(dateStr);
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const formattedDate = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일 (${dayNames[dateObj.getDay()]})`;

      const getTitleBg = (title) => {
        if (title === '청새치') return 'bg-[#0284c7] text-white';
        if (title === '렛미플라이') return 'bg-[#d9536f] text-white';
        return 'bg-[#1e3a8a] text-white';
      };

      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs" onClick={onClose}>
          <div className="relative bg-white border-2 border-[#2D5A38] rounded-xl w-full max-w-[300px] p-4 shadow-xl space-y-3" onClick={(e) => e.stopPropagation()}>
            
            {/* 상단 닫기(X) 버튼 */}
            <button 
              onClick={onClose} 
              className="absolute top-2.5 right-3 text-gray-400 hover:text-[#2D5A38] font-bold text-lg leading-none p-1 transition"
            >
              ✕
            </button>

            <div className="text-center pb-2 border-b border-[#D2E0D4] pr-4">
              <h3 className="text-xs font-black text-[#1B3622]">{formattedDate} 일정</h3>
            </div>

            <div className="space-y-2 max-h-[220px] overflow-y-auto no-scrollbar">
              {schedules.length === 0 ? (
                <p className="text-center text-xs text-gray-400 py-4 font-semibold">예정된 일정이 없습니다.</p>
              ) : (
                schedules.map((item) => (
                  <div 
                    key={item.id}
                    onClick={() => onSelectSchedule(item)}
                    className="p-2.5 rounded-lg border border-[#D2E0D4] bg-[#F9FBF9] hover:bg-[#EBF1EC] cursor-pointer transition active:scale-98 flex items-center justify-between"
                  >
                    <div>
                      <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded mr-1.5 ${getTitleBg(item.playTitle)}`}>
                        {item.playTitle}
                      </span>
                      <span className="text-xs font-black text-[#1B3622]">{item.time}</span>
                    </div>
                    {item.event && (
                      <span className="text-[9px] font-bold text-[#2D5A38] bg-white border border-[#2D5A38] px-1.5 py-0.5 rounded-full">
                        {item.event}
                      </span>
                    )}
                  </div>
                ))
              )}
            </div>

            <button 
              onClick={onClose} 
              className="w-full py-1.5 bg-gray-200 text-gray-700 font-bold text-xs rounded-md hover:bg-gray-300 transition active:scale-95"
            >
              닫기
            </button>
          </div>
        </div>
      );
    }

    /* --- 월별 캘린더 뷰 컴포넌트 --- */
    function CalendarView({ schedules, onSelectSchedule }) {
      const [currentDate, setCurrentDate] = useState(new Date(2026, 7, 1)); // 2026년 8월 기준
      const [selectedDate, setSelectedDate] = useState(null);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const daysArray = [];
      for (let i = 0; i < firstDayOfMonth; i++) daysArray.push(null);
      for (let d = 1; d <= daysInMonth; d++) daysArray.push(d);

      const getChipStyle = (title) => {
        if (title === '청새치') return 'bg-[#e0f2fe] text-[#0369a1] border-[#7dd3fc]';
        if (title === '렛미플라이') return 'bg-[#fce7f3] text-[#be185d] border-[#f472b6]';
        return 'bg-[#e0e7ff] text-[#1d4ed8] border-[#818cf8]';
      };

      const dailySchedules = selectedDate 
        ? schedules.filter((s) => s.date === selectedDate)
        : [];

      return (
        <div className="p-2 space-y-2">
          {/* 달력 컨트롤러 */}
          <div className="flex items-center justify-between px-2 py-1 bg-white rounded-lg border border-[#D2E0D4]">
            <span className="text-xs font-black text-[#1B3622]">{year}년 {month + 1}월</span>
            <div className="flex space-x-1">
              <button onClick={prevMonth} className="px-2 py-0.5 border rounded text-xs font-bold bg-[#F4F8F5] text-[#2D5A38] hover:bg-[#EBF1EC] active:scale-95">&lt;</button>
              <button onClick={nextMonth} className="px-2 py-0.5 border rounded text-xs font-bold bg-[#F4F8F5] text-[#2D5A38] hover:bg-[#EBF1EC] active:scale-95">&gt;</button>
            </div>
          </div>

          {/* 요일 헤더 */}
          <div className="grid grid-cols-7 text-center text-[10px] font-bold text-gray-500 bg-white/50 py-1 rounded">
            <span className="text-red-500">일</span>
            <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span>
            <span className="text-blue-500">토</span>
          </div>

          {/* 달력 날짜 셀 */}
          <div className="grid grid-cols-7 gap-1 text-center">
            {daysArray.map((day, idx) => {
              if (!day) return <div key={idx} className="h-12"></div>;

              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const daySchedules = schedules.filter((s) => s.date === dateStr);
              const hasSchedules = daySchedules.length > 0;

              return (
                <div 
                  key={idx} 
                  onClick={() => setSelectedDate(dateStr)}
                  className={`h-12 border rounded p-0.5 flex flex-col justify-start overflow-hidden cursor-pointer transition active:scale-95 ${
                    hasSchedules ? 'bg-white hover:bg-[#F4F8F5] border-[#2D5A38]/40 shadow-xs' : 'bg-white/50 border-[#D2E0D4]'
                  }`}
                >
                  <span className={`text-[9px] font-bold self-start leading-none mb-0.5 ${hasSchedules ? 'text-[#1B3622]' : 'text-gray-400'}`}>
                    {day}
                  </span>
                  <div className="space-y-0.5 overflow-hidden w-full">
                    {daySchedules.map((item) => (
                      <div
                        key={item.id}
                        className={`w-full text-[7px] font-extrabold px-0.5 py-0.2 rounded border truncate text-left leading-tight ${getChipStyle(item.playTitle)}`}
                      >
                        {item.time} {item.playTitle.slice(0, 2)}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {/* 일자별 상세 일정 모달 */}
          {selectedDate && (
            <DailyModal
              dateStr={selectedDate}
              schedules={dailySchedules}
              onClose={() => setSelectedDate(null)}
              onSelectSchedule={(item) => {
                setSelectedDate(null);
                onSelectSchedule(item);
              }}
            />
          )}
        </div>
      );
    }

    function App() {

      const [viewMode, setViewMode] = useState('list');

      const getTextColorClass = (title) => {
        if (title === '청새치') return 'text-[#0284c7]';

          return hasEvent ? 'bg-[#d9536f] text-white' : 'bg-[#fce7f3] text-[#be185d]';

      return (

                            <button

                </table>
              ) : (
                <CalendarView
                  schedules={SCHEDULES}
                  onSelectSchedule={(item) => setSelectedSchedule(item)}

            </main>

            {/* 프로필 이미지 + 정산판 이동 버튼 영역 */}

                      src={img.src} 
                      alt={img.alt} 
                      className="w-full h-full object-cover object-top transition-transform duration-200 hover:scale-105"

                        e.target.nextElementSibling.style.display = 'flex';
                      }}
                    />
                    <div className="hidden absolute inset-0 flex-col items-center justify-center text-[10px] text-[#527D5C] font-bold bg-[#EBF1EC]">
                      <span>{img.alt}</span>
                      <span className="text-[8px] font-normal text-[#88998C]">.png</span>
                    </div>
                  </div>

                  <a
                    href={img.link}
                    target="_blank"
                    rel="noopener noreferrer"
